<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 76" width="720" height="76" role="img" aria-label="One bar per topic, longest first, each as long as the share of the divergence between this repository&#x27;s parts that the topic accounts for"><style>/*
 * The rules for a bar chart that travels as a file. A markdown reader renders an image and not a page, so
 * the picture cannot reach the page's stylesheet and carries its own. Each row states its own two colours as
 * custom properties; these rules choose between them by the reader's colour scheme.
 */
.segment rect { fill:var(--c); rx:2; }
.segment-label { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:13px; fill:#3c4650; text-anchor:end; }
.segment-value { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:12px; fill:#5c6773; text-anchor:start; }
@media (prefers-color-scheme: dark) {
  .segment rect { fill:var(--cd); }
  .segment-label { fill:#dbe3ea; }
  .segment-value { fill:#93a1af; }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 96" width="720" height="96" role="img" aria-label="Themes as one bar, each segment the share of the reading that topic explains, grouped by the broad subject the publisher&#x27;s hierarchy places it under"><style>/*
 * The segment rules for a stacked bar that travels as a file. A markdown reader renders an image and not a
 * page, so the picture cannot reach the page's stylesheet and carries its own. Each segment states its own
 * two colours as custom properties; these rules choose between them by the reader's colour scheme.
 */
.segment rect { fill:var(--c); stroke:#ffffff; stroke-width:1; }
.segment-tick { stroke:var(--c); stroke-width:1; }
.segment-label { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:11px; fill:#3c4650; text-anchor:middle; }
@media (prefers-color-scheme: dark) {
  .segment rect { fill:var(--cd); stroke:#0e1216; }
  .segment-tick { stroke:var(--cd); }
  .segment-label { fill:#b6c2cf; }
}

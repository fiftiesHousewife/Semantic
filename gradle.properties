# The ben-manes dependencyUpdates task cannot run under parallel project execution.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# The macOS sandbox refuses the FSEvents stream, so file watching cannot start and stale VFS state lies
# about what is up to date. Watching off means every build checks the filesystem itself.
org.gradle.vfs.watch=false
